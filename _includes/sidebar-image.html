{% if page.sidebar_ext.image %}

  {% if include.image %}

    <img src="{{ include.image }}" alt="image" class="center">

  {% else %}

  {% capture image_name %}
  {{ site.url | append: site.baseurl | append: "/assets/images/people/" | append: page.title | append: ".png" }}
  {% endcapture %}

    <img src="{{ image_name | downcase }}" alt="image" class="center">

  {% endif %}
{% endif %}
