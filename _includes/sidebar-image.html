{% if page.sidebar_ext.image %}

  {% if include.image %}

    <img src="{{ include.image }}" alt="image" class="center">

  {% else %}

    <img src="{{ site.url | append: site.baseurl | append: "/assets/images/people/" | append: page.title | append: ".png" }}" alt="image" class="center">

  {% endif %}
{% endif %}
